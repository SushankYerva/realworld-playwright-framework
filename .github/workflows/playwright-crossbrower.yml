name: Playwright Cross-Browser

on:
  workflow_dispatch:

  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: read

concurrency:
  group: playwright-cross-browser
  cancel-in-progress: false

env:
  CI: true
  TEST_ENV: demo

jobs:
  cross-browser-smoke:
    name: Cross-browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Install Playwright browsers
        run: >
          npx playwright install --with-deps
          chromium firefox webkit

      - name: Run cross-browser smoke tests
        run: >
          npx playwright test
          --grep "@smoke"
          --project=chromium-anonymous
          --project=chromium-authenticated
          --project=firefox-anonymous
          --project=firefox-authenticated
          --project=webkit-anonymous
          --project=webkit-authenticated
          --workers=1

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cross-browser-html-report
          path: reports/html/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cross-browser-junit-report
          path: reports/junit/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cross-browser-failure-evidence
          path: test-results/
          retention-days: 14
          if-no-files-found: warn